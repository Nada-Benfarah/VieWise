<div class="auth-container">
  <h2 class="auth-title">Mot de passe oublié ?</h2>
  <form [formGroup]="forgetForm" (ngSubmit)="submit()" class="auth-form">
    <div class="form-group">
      <label for="email">Adresse email</label>
      <input id="email" type="email" formControlName="email" class="form-control" placeholder="Entrez votre email" [class.is-invalid]="forgetForm.get('email')?.invalid && forgetForm.get('email')?.touched">
      <div *ngIf="forgetForm.get('email')?.invalid && forgetForm.get('email')?.touched" class="invalid-feedback">
        Email invalide
      </div>
    </div>
    <button type="submit" class="btn btn-primary w-100" [disabled]="isSubmitting">Envoyer le lien</button>
    <div class="text-center mt-3">
      <a routerLink="/login">Retour à la connexion</a>
    </div>
  </form>
</div>
