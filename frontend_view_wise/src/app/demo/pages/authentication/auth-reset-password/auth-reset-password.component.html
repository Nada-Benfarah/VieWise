<div class="auth-container">
  <h2 class="auth-title">Nouveau mot de passe</h2>
  <form [formGroup]="resetForm" (ngSubmit)="submit()" class="auth-form">
    <div class="form-group">
      <label for="password">Nouveau mot de passe</label>
      <input id="password" type="password" formControlName="password" class="form-control" placeholder="Nouveau mot de passe" [class.is-invalid]="resetForm.get('password')?.invalid && resetForm.get('password')?.touched">
      <div *ngIf="resetForm.get('password')?.invalid && resetForm.get('password')?.touched" class="invalid-feedback">
        Le mot de passe doit contenir au moins 8 caractères
      </div>
    </div>
    <div class="form-group">
      <label for="confirmPassword">Confirmer le mot de passe</label>
      <input id="confirmPassword" type="password" formControlName="confirmPassword" class="form-control" placeholder="Confirmez le mot de passe" [class.is-invalid]="resetForm.hasError('mismatch') && resetForm.get('confirmPassword')?.touched">
      <div *ngIf="resetForm.hasError('mismatch') && resetForm.get('confirmPassword')?.touched" class="invalid-feedback">
        Les mots de passe ne correspondent pas
      </div>
    </div>
    <button type="submit" class="btn btn-primary w-100" [disabled]="isSubmitting">Réinitialiser</button>
    <div class="text-center mt-3">
      <a routerLink="/login">Retour à la connexion</a>
    </div>
  </form>
</div>
